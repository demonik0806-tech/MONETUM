<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MONETUM - Iniciar Sesión</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-container { background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 350px; text-align: center; }
        h2 { color: #333; margin-bottom: 20px; }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 10px; background-color: #28a745; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
        button:hover { background-color: #218838; }
        .error { color: red; font-size: 14px; }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Acceso MONETUM</h2>
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <p class="error">{{ messages[0] }}</p>
          {% endif %}
        {% endwith %}
        <form action="/" method="POST">
            <input type="text" name="username" placeholder="Ingresa tu usuario" required>
            <input type="password" name="password" placeholder="Ingresa tu contraseña" required>
            <input type="text" name="totp_code" placeholder="Código Authenticator (6 dígitos)" required autocomplete="off">
            <button type="submit">Ingresar</button>
        </form>
    </div>
</body>
</html>
