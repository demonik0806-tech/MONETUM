<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>MONETUM - Acceso</title>
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#0b0f19">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { background-color: #0b0f19; color: #fff; font-family: 'Segoe UI', Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: #121824; padding: 30px 25px; border-radius: 16px; width: 310px; text-align: center; border: 1px solid #1f293d; box-shadow: 0 10px 30px rgba(0,0,0,0.85); animation: popIn 0.4s ease; }
        @keyframes popIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .avatar { font-size: 52px; margin-bottom: 8px; cursor: pointer; user-select: none; transition: transform 0.2s; }
        .avatar:active { transform: scale(0.85); }
        input { width: 100%; padding: 11px; margin: 7px 0; background: #1a1e29; border: 1px solid #2d3342; color: white; border-radius: 8px; box-sizing: border-box; font-size: 14px; }
        input:focus { border-color: #8a7cfb; outline: none; }
        button { background: #6c5ce7; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 12px; transition: 0.3s; font-size: 14px; }
        button:hover { background: #5b4be2; }
    </style>
</head>
<body>
    <div class="box">
        <div class="avatar" id="icono-avatar" onclick="cambiarAvatar()">😈</div>
        <h2 style="color: #8a7cfb; margin: 0 0 4px 0; letter-spacing: 1px;">MONETUM</h2>
        <p style="color: #a1a9bd; font-size: 11px; margin: 0 0 18px 0;">BÓVEDA FINANCIERA</p>
        <form id="form-login">
            <input type="text" id="user" placeholder="Usuario" required autocomplete="off">
            <input type="password" id="pass" placeholder="Contraseña" required>
            <button type="submit">INGRESAR AL SISTEMA</button>
        </form>
    </div>
    <script>
        if ('serviceWorker' in navigator) { navigator.serviceWorker.register('/static/sw.js'); }
        const avatares = ['😈', '🤖', '👽', '🦊', '🐉', '🐼'];
        let indiceAvatar = 0;
        function cambiarAvatar() {
            indiceAvatar = (indiceAvatar + 1) % avatares.length;
            document.getElementById('icono-avatar').innerText = avatares[indiceAvatar];
        }

        document.getElementById('form-login').addEventListener('submit', async (e) => {
            e.preventDefault();
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    username: document.getElementById('user').value,
                    password: document.getElementById('pass').value
                })
            });
            const data = await res.json();
            if(data.success) window.location.href = data.redirect;
            else alert(data.error);
        });
    </script>
</body>
</html>
